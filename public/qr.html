<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>June X | QR Code Login</title>
  <meta name="description" content="Scan a QR code to link your WhatsApp account to June X.">
  <link rel="icon" href="https://github.com/eminentboy11.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #0b0d12; color: #e5e7eb; }
    .gold-text { background: linear-gradient(135deg, #f5c542, #d4a017); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .card { background: #11141b; border: 1px solid rgba(245,197,66,0.12); border-radius: 1rem; }
    .btn-gold { background: linear-gradient(135deg, #f5c542, #d4a017); color: #14100a; font-weight: 700; transition: transform .15s, box-shadow .15s; }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(245,197,66,0.25); }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <nav class="flex items-center justify-between px-6 md:px-12 py-5 border-b border-yellow-500/10">
    <a href="/" class="flex items-center gap-3 no-underline">
      <img src="https://github.com/eminentboy11.png" alt="June X" class="w-9 h-9 rounded-full border border-yellow-500/50">
      <span class="font-bold text-lg">June <span class="gold-text">X</span></span>
    </a>
    <a href="https://github.com/eminentboy11/velvet-sparrow-sessions" target="_blank" class="text-gray-400 hover:text-yellow-400 text-sm no-underline flex items-center gap-2">
      <i class="fab fa-github"></i> Source
    </a>
  </nav>

  <main class="flex-1 flex items-center justify-center px-6 py-14">
    <div class="max-w-lg w-full">
      <div class="card p-8 md:p-10 text-center">
        <h1 class="text-2xl font-extrabold">QR <span class="gold-text">Login</span></h1>
        <p class="text-gray-400 text-sm mt-2">Scan the QR with your phone to link your June X session.</p>

        <button onclick="startQR()" class="btn-gold w-full rounded-xl py-4 mt-7 text-base">
          <i class="fas fa-qrcode mr-2"></i>Generate QR Code
        </button>

        <p class="text-gray-500 text-xs mt-6">WhatsApp → <span class="text-gray-300">Settings → Linked Devices → Link a Device</span> → scan.</p>
      </div>
    </div>
  </main>

  <footer class="px-6 py-6 border-t border-yellow-500/10 text-center text-gray-500 text-xs">
    &copy; <span id="yr"></span> June X — Session Server
  </footer>

  <script>
    document.getElementById('yr').textContent = new Date().getFullYear();

    function startQR() {
      window.location.href = '/qr/session';
    }
  </script>
</body>
</html>
